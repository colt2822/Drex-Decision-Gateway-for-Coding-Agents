name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Package Import & Version Sanity Check
        run: |
          python -c "import drex_gateway; print('Loaded drex_gateway version:', drex_gateway.__version__)"

      - name: Run Test Suite (Offline Replay Mode)
        env:
          DREX_PROVIDER_MODE: REPLAY
        run: |
          pytest -v

      - name: CLI Smoke Test
        run: |
          drex-gateway --help
          drex-gateway --replay health
          drex-gateway --replay choose "Which verifier to run?" --choices "pytest,npm" --context "FastAPI app"

      - name: Replay Demo Smoke Test
        run: |
          drex-gateway --replay demo

      - name: Benchmark Runner Smoke Test
        run: |
          drex-gateway --replay benchmark

      - name: Examples Smoke Test
        env:
          DREX_PROVIDER_MODE: REPLAY
        run: |
          python examples/basic_decision.py
          python examples/coding_preflight.py
          python examples/failure_triage.py
          python examples/patch_triage.py
          python examples/batch_decisions.py
          python examples/outcome_feedback.py
          python examples/mcp_agent_demo.py
