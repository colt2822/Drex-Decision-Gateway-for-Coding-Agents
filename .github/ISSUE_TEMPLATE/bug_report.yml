name: Bug Report
description: Create a report to help us improve Drex Decision Gateway
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, provider mode (LIVE or REPLAY), model name.
      placeholder: Python 3.11, Ubuntu 22.04, Drex LIVE (drex-latest)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or minimal script to reproduce the issue.
      placeholder: |
        1. Run `drex-gateway ...`
        2. Call `client.choose(...)`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
