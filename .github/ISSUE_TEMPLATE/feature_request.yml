name: Feature Request
description: Suggest an idea or enhancement for Drex Decision Gateway
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new decision schema, agent integration, or performance optimization?
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific bottleneck in coding-agent loops?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
